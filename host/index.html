<!doctype html>
<!--
  Host page. Slimmed down from the official ext-apps basic-host (MIT OR Apache-2.0):
  https://github.com/modelcontextprotocol/ext-apps/tree/main/examples/basic-host
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP Apps test host</title>
    <style>
      body { font: 14px/1.4 system-ui; margin: 24px; max-width: 760px; }
      label { display: block; margin: 8px 0; }
      input[type="url"], input[type="text"], select { width: 100%; box-sizing: border-box; }
      .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      iframe { width: 100%; height: 420px; border: 1px solid #ccc; border-radius: 8px; }
      button { font: inherit; }
      /* Post 3 only. Hidden unless the page is opened with ?log=1. */
      #traffic { margin-top: 16px; }
      #traffic h2 { font-size: 16px; margin: 0 0 4px; }
      #traffic p { margin: 0 0 8px; opacity: 0.75; }
      #log {
        font: 12px/1.45 ui-monospace, monospace;
        background: #f4f4f4;
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre-wrap;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>MCP Apps test host</h1>
    <label>MCP server <input id="mcp" type="url" /></label>
    <div class="row">
      <button id="connect" type="button">Connect</button>
      <label><input id="dark" type="checkbox" /> dark theme</label>
    </div>
    <label>Tool <select id="tool"></select></label>
    <label>Arguments (JSON) <input id="args" type="text" value="{}" spellcheck="false" /></label>
    <div class="row"><button id="call" type="button">Call</button></div>
    <p id="status">Connecting…</p>
    <iframe id="app" title="MCP App view" referrerpolicy="origin"></iframe>
    <!-- Post 3 opt-in. host.ts unhides this when the URL has ?log=1. -->
    <section id="traffic" hidden>
      <h2>AppBridge traffic</h2>
      <p>postMessage between this page, the sandbox proxy, and the view.</p>
      <pre id="log"></pre>
    </section>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
